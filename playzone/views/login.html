{{define "content"}}
<section class="card card-auth">
    <h1 class="section-title">🎮 Connexion</h1>
    <p class="muted">Re GG !</p>

    <form method="post" action="/login" class="formulaire">
        <label>
            Pseudo ou email
            <input type="text" name="login" required autofocus
                value="{{if .Data}}{{.Data.Login}}{{end}}">
        </label>
        <label>
            Mot de passe
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn-primary btn-block">Se connecter</button>
    </form>

    <p class="muted center">Pas encore de compte ? <a href="/register">Inscris-toi</a></p>

    <p class="info">
        Comptes de demo :<br>
        Admin : <code>admin</code> / <code>Admin1234567!</code><br>
        User : <code>demo</code> / <code>Demo1234567!</code>
    </p>
</section>
{{end}}
